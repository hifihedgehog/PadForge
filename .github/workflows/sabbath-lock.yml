# Sabbath lock.
#
# Sets repository interactions to `collaborators_only` every Saturday at
# 23:59 America/New_York. The lock self-expires 24 hours later (Sun
# 23:59 ET) via the interaction-limits API's one_day window. The
# companion sabbath-unlock.yml cron at Mon 00:01 ET acts as a safety
# belt: it DELETEs the lock if for any reason it is still active past
# midnight ET. DELETE is idempotent, so the normal weekly path runs
# unlock-as-no-op.
#
# Owner and collaborators are exempt. Outside contributors are
# temporarily restricted from opening issues, opening pull requests, and
# commenting. Discussions are not covered by the interaction-limits API
# and remain open.
#
# Authentication
# --------------
# This workflow CANNOT use GITHUB_TOKEN. The interaction-limits endpoint
# requires the `Administration: write` repository permission, which is
# not in the set of scopes that the workflow `permissions:` block can
# grant to GITHUB_TOKEN.
#
# Setup steps for the owner:
#   1. Create a fine-grained Personal Access Token at
#      https://github.com/settings/personal-access-tokens/new
#   2. Resource owner: hifihedgehog. Repository access: only this repo.
#   3. Permissions: Administration -> Read and write.
#   4. Set a long expiry (PATs cannot be perpetual; rotate yearly).
#   5. Store the token as repository secret SABBATH_PAT under
#      Settings -> Secrets and variables -> Actions.
#
# Cron minute :59 chosen per the user's requested lock-at-23:59-ET.
# Scheduled GitHub Actions can run several minutes late under load;
# the lock may actually start a few minutes past midnight ET. In the
# worst case the first few minutes of Sunday are unlocked.
#
# Manual re-lock is available via the Actions tab (workflow_dispatch).

name: Sabbath lock

on:
  schedule:
    - cron: "59 23 * * 6"
      timezone: "America/New_York"
  workflow_dispatch:

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Set interaction limit to collaborators_only for one day
        env:
          PAT: ${{ secrets.SABBATH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "SABBATH_PAT secret is not set. See header comment in this workflow file." >&2
            exit 1
          fi
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/interaction-limits" \
            -d '{"limit":"collaborators_only","expiry":"one_day"}'
