<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PadForge - Custom Controller</title>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0e15">
    <link rel="stylesheet" href="/css/padforge.css">
    <style>
        /* The build-your-own pad in the program's colors (#574). A widget
           rests in steel and turns ember while it is pressed, a touch area
           is marked in the cold blue, and what is picked for editing is
           ringed in ember. */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ground); color: var(--text-1);
                     font-family: var(--font); touch-action: none; }
        #canvas { position: absolute; inset: 0; }

        .widget { position: absolute; touch-action: none; }
        .w-button { border-radius: 50%; background: var(--raised); border: 2px solid var(--dot-ring);
                    display: flex; align-items: center; justify-content: center;
                    font-weight: 700; font-size: 16px; color: var(--text-1); }
        .w-button.pressed { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); }
        .w-stick { border-radius: 50%; background: var(--well); border: 2px solid var(--card-edge); }
        .w-stick .knob { position: absolute; width: 44%; height: 44%; left: 28%; top: 28%;
                         border-radius: 50%; background: var(--dot-ring); border: 2px solid var(--text-3); }
        .w-slider { border-radius: 10px; background: var(--well); border: 2px solid var(--card-edge);
                    overflow: hidden; }
        .w-slider .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
                          background: var(--ember); opacity: 0.75; }
        .w-slider .tag { position: absolute; top: 4px; width: 100%; text-align: center;
                         font-size: 11px; color: var(--text-2); }
        .w-dpad { background: var(--raised); border: 2px solid var(--dot-ring); border-radius: 14px; }
        .w-dpad:after { content: "\271B"; position: absolute; inset: 0; display: flex;
                        align-items: center; justify-content: center; font-size: 34px; color: var(--text-3); }
        .w-touch { background: var(--cold-tint); border: 2px dashed var(--cold-line); border-radius: 10px; }
        .w-touch .tag { position: absolute; top: 4px; width: 100%; text-align: center;
                        font-size: 11px; color: var(--cold); }

        .selected { outline: 3px solid var(--ember); }
        .handle { position: absolute; right: -10px; bottom: -10px; width: 22px; height: 22px;
                  border-radius: 50%; background: var(--ember); border: 2px solid var(--ground); display: none; z-index: 5; }
        .selected .handle { display: block; }

        #toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: none;
                   background: var(--veil); border-bottom: 1px solid var(--line-soft);
                   padding: 8px 10px; gap: 8px; align-items: center; flex-wrap: wrap; }
        #toolbar.on { display: flex; }
        #toolbar select, #toolbar input, #toolbar button {
            background: var(--field); color: var(--text-1); border: 1px solid var(--field-edge); border-radius: 8px;
            padding: 6px 10px; font: 13px var(--font); }
        #toolbar button { background: var(--card); border-color: var(--card-edge); font-weight: 600; }
        #toolbar button:active { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); }
        #toolbar #padName { width: 130px; }
        #toolbar .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
        #toolbar .check input { padding: 0; accent-color: var(--ember); }
        #toolbar .pf-chip { padding: 6px 10px; font: 600 13px var(--font); }
        /* Edit is css/padforge.css's chip, at the lower left corner. */
        #editBtn { position: fixed; bottom: 10px; left: 10px; z-index: 55; opacity: 0.9; }
        #statusBar { position: fixed; bottom: 12px; right: 12px; z-index: 40;
                     font-size: 11px; color: var(--text-3); pointer-events: none; }
        #disconnect-message { display: none; position: fixed; inset: 0; z-index: 60; }
    </style>
</head>
<body>
    <div id="toolbar">
        <select id="palette">
            <option value="">+ Add widget</option>
            <optgroup label="Buttons">
                <option value="b0">A</option><option value="b1">B</option>
                <option value="b2">X</option><option value="b3">Y</option>
                <option value="b4">LB</option><option value="b5">RB</option>
                <option value="b6">Back</option><option value="b7">Start</option>
                <option value="b8">LS Click</option><option value="b9">RS Click</option>
                <option value="b10">Guide</option><option value="b11">Misc 1</option>
                <option value="b12">R Paddle 1</option><option value="b13">L Paddle 1</option>
                <option value="b14">R Paddle 2</option><option value="b15">L Paddle 2</option>
                <option value="b17">Misc 2</option><option value="b18">Misc 3</option>
            </optgroup>
            <optgroup label="Analog">
                <option value="s0">Left Stick</option>
                <option value="s3">Right Stick</option>
                <option value="t2">LT Slider</option>
                <option value="t5">RT Slider</option>
            </optgroup>
            <optgroup label="Surfaces">
                <option value="dpad">D-Pad</option>
                <option value="touch">Touch Area</option>
            </optgroup>
        </select>
        <button id="delWidget">Remove</button>
        <label class="check"><input type="checkbox" id="snap" checked> Grid</label>
        <input id="padName" placeholder="Pad name" maxlength="40">
        <button id="saveBtn">Save</button>
        <button id="deleteLayoutBtn">Delete pad</button>
        <!-- Fullscreen toggle mount (#402): in the edit toolbar, so it covers no widget in play mode. -->
        <span id="fsMount"></span>
    </div>
    <div id="canvas"></div>
    <button id="editBtn" class="pf-chip">&#9998; Edit</button>
    <div id="statusBar"></div>
    <div id="disconnect-message" class="pf-cover"><h2>Disconnected. Tap to reconnect.</h2></div>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/custom_client.js"></script>
</body>
</html>
