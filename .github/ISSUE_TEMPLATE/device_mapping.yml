name: Device Mapping Submission
description: Submit a gamepad mapping for a device not recognized by PadForge
title: "[Device Mapping] "
labels: ["device-mapping"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a device mapping! This helps PadForge automatically recognize your controller.

        ## How to fill this out

        1. **Connect your device** and open PadForge's **Devices** page.
        2. **Select your device** to see the raw input visualization.
        3. **Press each physical button or move each axis** and note which raw index lights up.
        4. **Fill in the mapping tables below** with those raw indices.

        > **Tip:** the easiest path is to click the **Submit Mapping** button on the device's card in PadForge's Devices page. It pre-fills the device name, VID, PID, axis/button/POV counts, and SDL GUID automatically. You only have to fill in the per-input mapping tables by hand.

        ### What we are mapping to: the Xbox 360 layout

        ![Xbox 360 controller layout](https://raw.githubusercontent.com/hifihedgehog/PadForge/main/.github/images/xbox360-controller-layout.png)

        Each row in the tables below corresponds to ONE physical Xbox 360 input. Find the equivalent button or axis on YOUR controller and write its raw index next to the matching row.

        Reference for the row labels:

        - **A (South)** — bottom face button (green on Xbox 360)
        - **B (East)** — right face button (red on Xbox 360)
        - **X (West)** — left face button (blue on Xbox 360)
        - **Y (North)** — top face button (yellow on Xbox 360)
        - **Left Bumper / Right Bumper** — the two flat top shoulder buttons (LB / RB)
        - **Back / Select** — small button to the left of the Xbox logo
        - **Start / Menu** — small button to the right of the Xbox logo
        - **Left Stick Click / Right Stick Click** — pressing the analog stick straight down (L3 / R3)
        - **Guide / Home** — the central round Xbox-logo button
        - **Left Stick X / Y** — horizontal / vertical motion of the left analog stick
        - **Right Stick X / Y** — horizontal / vertical motion of the right analog stick
        - **Left Trigger / Right Trigger** — the two analog squeeze-buttons under the bumpers (LT / RT)

        > **IMPORTANT.** The "Raw Button Index" and "Raw Axis Index" columns are pre-filled with `FILL IN` placeholders. **Replace each one with the actual number you read from PadForge's Devices page raw input visualization.** If your controller does NOT have a particular Xbox 360 input (no triggers, no second stick, no Guide button, etc.), write `none` in that cell. Submissions where any cell still says `FILL IN` cannot be integrated and will be sent back for revision.

  - type: input
    id: device_name
    attributes:
      label: Device Name
      description: As shown in PadForge's Devices page
      placeholder: "e.g., HORIPAD S"
    validations:
      required: true

  - type: input
    id: vid
    attributes:
      label: USB Vendor ID (hex)
      description: From the VID:PID line on the Devices page
      placeholder: "e.g., 0F0D"
    validations:
      required: true

  - type: input
    id: pid
    attributes:
      label: USB Product ID (hex)
      description: From the VID:PID line on the Devices page
      placeholder: "e.g., 00C1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: axes
    attributes:
      label: Axis Count
      description: Number of axes shown in the raw input visualization
      placeholder: "e.g., 6"

  - type: input
    id: buttons
    attributes:
      label: Button Count
      description: Number of buttons shown in the raw input visualization
      placeholder: "e.g., 14"

  - type: input
    id: hats
    attributes:
      label: Hat/POV Count
      description: Number of D-Pad hat switches
      placeholder: "e.g., 1"

  - type: input
    id: sdl_guid
    attributes:
      label: SDL GUID
      description: |
        The 32-character SDL GUID shown on the Devices page under "SDL GUID".
        This is auto-filled when you use the Submit Mapping button in PadForge.
      placeholder: "e.g., 0300b70c6d04000062c2000000000000"
    validations:
      required: true

  - type: textarea
    id: button_mapping
    attributes:
      label: Button Mapping
      description: |
        For each physical button, note which raw button index lights up in PadForge's Devices page raw input visualization.
        Replace `FILL IN` with the actual number. Use `none` if your controller does not have that button.
      value: |
        | Physical Button   | Raw Button Index |
        |-------------------|------------------|
        | A (South)         | FILL IN          |
        | B (East)          | FILL IN          |
        | X (West)          | FILL IN          |
        | Y (North)         | FILL IN          |
        | Left Bumper       | FILL IN          |
        | Right Bumper      | FILL IN          |
        | Back / Select     | FILL IN          |
        | Start / Menu      | FILL IN          |
        | Left Stick Click  | FILL IN          |
        | Right Stick Click | FILL IN          |
        | Guide / Home      | FILL IN          |
    validations:
      required: true

  - type: textarea
    id: axis_mapping
    attributes:
      label: Axis Mapping
      description: |
        For each physical axis, note which raw axis index moves in PadForge's Devices page raw input visualization.
        Also note the direction: does pushing the stick right or up increase the raw value? If it goes the WRONG way, set Inverted? to "Yes".
        Replace `FILL IN` with the actual number. Use `none` if your controller does not have that axis.
      value: |
        | Physical Axis  | Raw Axis Index | Inverted? |
        |----------------|----------------|-----------|
        | Left Stick X   | FILL IN        | No        |
        | Left Stick Y   | FILL IN        | No        |
        | Right Stick X  | FILL IN        | No        |
        | Right Stick Y  | FILL IN        | No        |
        | Left Trigger   | FILL IN        | No        |
        | Right Trigger  | FILL IN        | No        |
    validations:
      required: true

  - type: textarea
    id: dpad_config
    attributes:
      label: D-Pad Configuration
      description: |
        How does the D-Pad report? Pick one:
        - **Hat switch**: which hat index? (usually Hat 0)
        - **Buttons**: which raw button indices for Up/Down/Left/Right?
      placeholder: |
        Hat 0
        -- or --
        Up: button 12, Down: button 13, Left: button 14, Right: button 15

  - type: markdown
    attributes:
      value: |
        ## Bonus: HIDMaestro device profile

        PadForge's input mapping (above) tells PadForge how to **read** your controller. The HIDMaestro profile tells PadForge how to **emulate** your controller back out to games — useful if your device is one PadForge does not yet recognize for full passthrough.

        Capturing this profile takes about 30 seconds and lets us add your device to the built-in catalog so the next person with the same controller does not have to fill in this form at all.

        ### How to capture it (step by step)

        1. **Plug in your controller** so PadForge can see it.
        2. Open PadForge and go to the **Pads** page (the main page with the four controller slot cards).
        3. Pick any slot card and set its output type to **Extended**. (You can change it back when you are done — capturing the profile does not break anything.)
        4. Next to the **Profile** dropdown on that slot, click the **Imported profiles…** button.
        5. The **Imported Profiles** window opens. The bottom list, **Connected devices available to import**, shows every HID device currently plugged in. Find your controller in that list and click it. PadForge captures the device's descriptor and adds a new entry to the **Your imported profiles** list at the top, named after your device with **(User Generated)** at the end.
        6. Click that new entry to select it, then click the **Export…** button on the right.
        7. A Save dialog appears. Pick any folder you can find again (Desktop is fine), keep the suggested filename, and click **Save**. You now have a `.json` file.
        8. **Drag that `.json` file into the box below** (or click the box and pick the file). GitHub will attach it to this issue.

        That is it. You can close the **Imported Profiles** window and put the slot back to whatever output type you were using before.

  - type: textarea
    id: hidmaestro_profile
    attributes:
      label: HIDMaestro profile JSON (optional but very helpful)
      description: |
        Drag the `.json` file you exported in step 7 above into this box. GitHub will replace this text with an attachment link automatically. Skip this section if you cannot capture the profile for any reason — the input mapping above is still useful on its own.
      placeholder: |
        Drag the exported .json file here.

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Please confirm before submitting
      options:
        - label: I have replaced every FILL IN placeholder with either a raw index or 'none'.
          required: true
        - label: All buttons I mapped respond correctly in PadForge's raw input visualization
          required: true
        - label: All axes I mapped move in the expected direction
          required: true
        - label: I tested with the device connected directly (not through a hub/adapter that might change the mapping)
