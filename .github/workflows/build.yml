name: Build

on:
  push:
    branches: [v3-dev]
  pull_request:
    branches: [v3-dev]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Publish
        run: dotnet publish PadForge.App/PadForge.App.csproj -c Release

      - name: Get build info
        shell: bash
        run: |
          echo "COMMIT_SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PadForge_r${{ env.COMMIT_COUNT }}@${{ env.COMMIT_SHORT }}
          path: PadForge.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/

      - name: Package release zip
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p release
          cd PadForge.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish
          rm -f *.pdb
          7z a -mx=9 "$GITHUB_WORKSPACE/release/PadForge.zip" ./*
          cp "$GITHUB_WORKSPACE/release/PadForge.zip" \
             "$GITHUB_WORKSPACE/release/PadForge_r${COMMIT_COUNT}@${COMMIT_SHORT}.zip"

      - name: Release rolling dev archive
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -o pipefail
          base="archive-${REF}"
          asset="release/PadForge_r${COMMIT_COUNT}@${COMMIT_SHORT}.zip"
          limit=999   # GitHub caps a release at 1000 assets. Roll a bit early.

          # Highest existing archive part (base = part 1, base-N = part N).
          part=$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName' \
                 | { grep -E "^${base}(-[0-9]+)?$" || true; } \
                 | sed -E "s/^${base}$/${base}-1/" | sed -E "s/^${base}-//" \
                 | sort -n | tail -1)
          [ -z "$part" ] && part=1
          if [ "$part" -le 1 ]; then active="$base"; else active="${base}-${part}"; fi

          count=$(gh release view "$active" --repo "$REPO" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          echo "Active archive $active has $count assets"

          # When the active part is full, start a new one that links back to it.
          if [ "$count" -ge "$limit" ]; then
            prev="$active"
            part=$((part + 1))
            active="${base}-${part}"
            echo "Archive full, rolling to $active"
            gh release create "$active" --repo "$REPO" --target "$SHA" --prerelease \
              --title "PadForge dev build archive (part ${part})" \
              --notes "Older dev builds are in the previous archive: https://github.com/${REPO}/releases/tag/${prev}" \
              || echo "(part may already exist)"
          fi

          # First-ever run for this part: make sure it exists.
          gh release view "$active" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$active" --repo "$REPO" --target "$SHA" --prerelease \
              --title "PadForge dev build archive" \
              --notes "Latest build: https://github.com/${REPO}/releases/tag/latest-${REF}" \
              || true

          gh release upload "$active" --repo "$REPO" --clobber "$asset"
          echo "ARCHIVE_TAG=$active" >> "$GITHUB_ENV"

      - name: Release — latest-${{ github.ref_name }}
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="latest-${{ github.ref_name }}"
          gh release delete "$tag" \
            --repo "${{ github.repository }}" \
            --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "PadForge r${COMMIT_COUNT}@${COMMIT_SHORT}" \
            --notes "Build archive: https://github.com/${{ github.repository }}/releases/tag/${ARCHIVE_TAG:-archive-${{ github.ref_name }}}
          Build log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release upload "$tag" \
            --repo "${{ github.repository }}" \
            --clobber \
            "release/PadForge.zip"
