<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PadForge - Web Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0e15">
    <link rel="stylesheet" href="/css/layout_view.css">
    <style>
        /* The phone's home page (#574, board WebController). Colors are the
           app's dark brushes, named beside each value. */
        :root {
            color-scheme: dark;
            --ground: #0a0e15;      /* ApplicationBackgroundBrush, SteelGroundBrush */
            --card: #121925;        /* CardBackgroundFillColorDefaultBrush */
            --card-lift: #161e2b;   /* SteelCardHoverBrush */
            --card-edge: #263142;   /* SteelPillLineBrush */
            --field: #0d131d;       /* SteelFieldBrush, TextControlBackground */
            --field-edge: #2a3546;  /* SteelLineBrush, TextControlElevationBorderBrush */
            --text-1: #eef2f7;      /* TextFillColorPrimaryBrush */
            --text-2: #a9b4c4;      /* TextFillColorSecondaryBrush */
            --text-3: #8693a6;      /* TextFillColorTertiaryBrush, TextControlPlaceholderForeground */
            --ember: #ff6b2c;       /* EmberBrush */
            --ember-lift: #ff8450;  /* EmberLiftBrush */
            --ember-press: #e85f25; /* EmberPressBrush */
            --ember-ink: #160a03;   /* EmberInkBrush */
            --ember-pick: #1d1611;  /* EmberPickBrush */
            --dot-ring: #3a475a;    /* the board's swatch ring */
            --focus: #7cc7ea;       /* ColdBrush */
        }
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--ground);
            color: var(--text-1);
            font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.4;
        }
        h1, h2, p { margin: 0; }
        button, input {
            margin: 0;
            font: inherit;
            color: inherit;
            -webkit-appearance: none;
            appearance: none;
        }
        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        ::placeholder { color: var(--text-3); opacity: 1; }

        /* One column on a phone held upright, as the board draws it. */
        .home {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 20px 20px 24px;
        }
        .side, .main { display: flex; flex-direction: column; gap: 18px; }
        .main { flex: 1 1 auto; container-type: inline-size; }

        .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
        .mark { flex: none; width: 30px; height: 30px; object-fit: contain; }

        .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); }
        .field input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid var(--field-edge);
            background: var(--field);
            font-size: 16px;
            color: var(--text-1);
        }

        .go {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 64px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 0;
            background: var(--ember);
            color: var(--ember-ink);
            text-align: center;
        }
        .go-name { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
        .go-note { font-size: 13px; }
        .go:active { background: var(--ember-press); }

        .head { font-size: 13px; font-weight: 600; color: var(--text-2); }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .pick .grid { margin-top: 10px; }

        .lay {
            --tile: var(--card);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
            min-height: 118px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--card-edge);
            background: var(--tile);
            text-align: left;
        }
        .lay[aria-pressed="true"] { --tile: var(--ember-pick); border-color: var(--ember); }
        .preview {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 62px;
            pointer-events: none;
        }
        .preview .pf-pad { display: block; }
        .glyph { flex: none; width: 34px; height: 34px; color: var(--text-2); }
        .glyph .cut { fill: var(--tile); }
        .name { max-width: 100%; font-weight: 600; overflow-wrap: anywhere; }
        .line { max-width: 100%; font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
        .nb { white-space: nowrap; }

        .dots { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px; }
        .dotb {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
        }
        .dotb span {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--ground);
            box-shadow: 0 0 0 1px var(--dot-ring);
        }
        .dotb[aria-pressed="true"] span { box-shadow: 0 0 0 2px var(--ember); }

        .more-wrap { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
        .more {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 52px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid var(--card-edge);
            background: var(--card);
            text-align: left;
        }
        .more-text { flex: 1 1 auto; min-width: 0; }
        .more-title { display: block; font-weight: 600; }
        .more-summary {
            display: block;
            font-size: 13px;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chev { flex: none; width: 13px; height: 16px; color: var(--text-2); }
        .more[aria-expanded="true"] .chev { transform: rotate(90deg); }

        @media (hover: hover) {
            .go:hover { background: var(--ember-lift); }
            .go:active { background: var(--ember-press); }
            .lay[aria-pressed="false"]:hover { --tile: var(--card-lift); }
            .more:hover { background: var(--card-lift); }
        }

        /* A phone on its side: the name and Continue stay at the left while
           the layouts scroll at the right, and the finish dots stay on screen
           over the tiles that pass under them. */
        @media (orientation: landscape) and (min-width: 640px) {
            .home {
                display: grid;
                grid-template-columns: 320px minmax(0, 1fr);
                column-gap: 28px;
                align-items: start;
                max-width: 1040px;
                padding: 16px 24px 24px;
            }
            .side { position: sticky; top: 16px; }
            .finish {
                position: sticky;
                top: 0;
                z-index: 1;
                margin: -12px 0 -10px;
                padding: 12px 0 10px;
                background: var(--ground);
            }
        }
        @container (min-width: 640px) {
            .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
<!-- The phone's home page (#574). The layout this phone used last is one
     button, four common layouts sit under it, and the rest open under More
     Layouts. js/home_client.js runs it. Like every web controller page it is
     English, whatever the language PadForge shows. -->
<main class="home">
    <div class="side">
        <div class="brand"><img class="mark" src="/img/Resources/PadForge-icon.png" alt="" width="30" height="30">PadForge</div>
        <!-- The viewer's name (#555), kept in this browser. The controller,
             Browser Gamepad and builder pages send it, so the streamer's
             Devices page names each phone. -->
        <label class="field">Your Name
            <input id="viewerName" type="text" maxlength="24" autocomplete="nickname" spellcheck="false" enterkeyhint="done" placeholder="Shown to the streamer">
        </label>
        <button id="continueButton" class="go" type="button">
            <span id="continueName" class="go-name">Continue with Xbox Series X|S</span>
            <span id="continueNote" class="go-note" hidden>Last used on this phone</span>
        </button>
    </div>
    <div class="main">
        <section class="pick">
            <h1 class="head">Pick a Layout</h1>
            <div id="layoutGrid" class="grid">
                <button class="lay" type="button" aria-pressed="false" data-key="xboxseries" data-href="/controller.html?layout=xboxseries">
                    <span class="preview" data-layout="xboxseries"></span>
                    <span class="name">Xbox Series X|S</span>
                    <span class="line">Share button, hybrid <span class="nb">D-pad</span></span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="dualsense" data-href="/controller.html?layout=dualsense">
                    <span class="preview" data-layout="dualsense"></span>
                    <span class="name">DualSense</span>
                    <span class="line">PS5 layout with mute button</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="switchpro" data-href="/controller.html?layout=switchpro">
                    <span class="preview" data-layout="switchpro"></span>
                    <span class="name">Switch Pro</span>
                    <span class="line">Nintendo layout with Capture</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="touchpad" data-href="/touchpad.html">
                    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4 14h16"/></svg>
                    <span class="name">Touchpad</span>
                    <span class="line">A touch surface, no buttons</span>
                </button>
            </div>
        </section>
        <section id="finishSection" class="finish" hidden>
            <h2 id="finishHeading" class="head">Finish</h2>
            <div id="finishGroup" class="dots" role="group" aria-labelledby="finishHeading"></div>
        </section>
        <div class="more-wrap">
            <button id="moreButton" class="more" type="button" aria-expanded="false" aria-controls="moreGrid">
                <span class="more-text">
                    <span class="more-title">More Layouts</span>
                    <span id="moreSummary" class="more-summary">Xbox 360, Xbox One, DualShock 4, DualSense Edge and 6 more</span>
                </span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <div id="moreGrid" class="grid" hidden>
                <button class="lay" type="button" aria-pressed="false" data-key="xbox360" data-href="/controller.html?layout=xbox360">
                    <span class="preview" data-layout="xbox360"></span>
                    <span class="name">Xbox 360</span>
                    <span class="line">Classic layout, dual analog sticks</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="xboxone" data-href="/controller.html?layout=xboxone">
                    <span class="preview" data-layout="xboxone"></span>
                    <span class="name">Xbox One</span>
                    <span class="line">Xbox One S layout</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="ds4" data-href="/controller.html?layout=ds4">
                    <span class="preview" data-layout="ds4"></span>
                    <span class="name">DualShock 4</span>
                    <span class="line">Touchpad and lightbar</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="dualsenseedge" data-href="/controller.html?layout=dualsenseedge">
                    <span class="preview" data-layout="dualsenseedge"></span>
                    <span class="name">DualSense Edge</span>
                    <span class="line">Fn buttons and back paddles</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="switch2pro" data-href="/controller.html?layout=switch2pro">
                    <span class="preview" data-layout="switch2pro"></span>
                    <span class="name">Switch 2 Pro</span>
                    <span class="line">C button and back paddles</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="steamdeck" data-href="/controller.html?layout=steamdeck">
                    <span class="preview" data-layout="steamdeck"></span>
                    <span class="name">Steam Deck</span>
                    <span class="line">Dual trackpads and four grips</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="steamcontroller" data-href="/controller.html?layout=steamcontroller">
                    <span class="preview" data-layout="steamcontroller"></span>
                    <span class="name">Steam Controller</span>
                    <span class="line">Dual trackpads and paddles</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="gamepad" data-href="/gamepad.html">
                    <svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.87" aria-hidden="true"><rect x="9" y="3" width="14" height="26" rx="3"/><rect class="cut" x="3" y="12" width="26" height="12" rx="6"/><circle cx="9" cy="18" r="2.2" fill="currentColor"/><circle cx="23" cy="18" r="2.2" fill="currentColor"/></svg>
                    <span class="name">Browser Gamepad</span>
                    <span class="line">Forward a controller paired to this phone, or built into this handheld</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="menus" data-href="/menus.html">
                    <svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.87" aria-hidden="true"><rect x="4" y="4" width="10" height="10" rx="2"/><rect x="18" y="4" width="10" height="10" rx="2"/><rect x="4" y="18" width="10" height="10" rx="2"/><rect x="18" y="18" width="10" height="10" rx="2" fill="currentColor" fill-opacity="0.35"/></svg>
                    <span class="name">Web Menus</span>
                    <span class="line">A slot's Touch Grid menus as tiles</span>
                </button>
                <button class="lay" type="button" aria-pressed="false" data-key="build" data-href="/custom.html?id=new">
                    <svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.87" stroke-linecap="round" aria-hidden="true"><rect x="4" y="7" width="24" height="18" rx="4"/><path d="M16 12v8M12 16h8"/></svg>
                    <span class="name">Build Your Own</span>
                    <span class="line">Drag widgets onto a blank pad</span>
                </button>
            </div>
        </div>
    </div>
</main>
<script src="/js/layout_view.js"></script>
<script src="/js/home_client.js"></script>
</body>
</html>
