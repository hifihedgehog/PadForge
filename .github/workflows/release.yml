name: Release (signed)

# Builds PadForge in GitHub Actions and has SignPath sign PadForge.exe, then
# publishes a draft release with the signed PadForge-vX.Y.Z-win-x64.zip.
#
# SignPath only signs artifacts built by the trusted CI, so a signed stable
# release MUST be built here, not on a local machine.
#
# Push a version tag to make a release:   git tag v3.5.0 && git push origin v3.5.0
# Or run manually (workflow_dispatch) to validate the pipeline with the TEST cert.
#
# ─── Before the first run, fill these in ───────────────────────────────────
#   1. Create the SignPath project, artifact configuration, and API token
#      (see .signpath/artifact-configuration.xml and the setup notes).
#   2. Repo secret:  SIGNPATH_API_TOKEN  (Settings > Secrets and variables > Actions)
#   3. Replace the three SIGNPATH_* values in `env` below with your project's
#      real identifiers (Organization id, project slug, artifact-config slug).
#   4. Confirm the signing-policy slugs ('test-signing' / 'release-signing')
#      match your project's Signing Policies page; rename below if different.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      test_sign:
        description: 'Sign with the SignPath TEST certificate (pipeline validation only)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # ── SignPath identifiers (from your SignPath project. Not secret values.) ──
  # Organization ID is the GUID in the portal URL after /Web/ (or on the API-token page).
  SIGNPATH_ORG_ID: '61b8908b-222b-40e5-afc9-31a0ebcb13c0'
  SIGNPATH_PROJECT_SLUG: 'PadForge'
  PUBLISH_DIR: 'PadForge.App/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Publish
        run: dotnet publish PadForge.App/PadForge.App.csproj -c Release

      - name: Stage exe + resolve version
        id: stage
        shell: bash
        run: |
          mkdir -p unsigned
          cp "$PUBLISH_DIR/PadForge.exe" unsigned/PadForge.exe
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=test-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # SignPath downloads the artifact from GitHub, so it must be uploaded first.
      # GitHub wraps the single exe in a .zip container; the artifact configuration
      # signs PadForge.exe inside that zip.
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: PadForge-unsigned
          path: unsigned/PadForge.exe
          if-no-files-found: error

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ env.SIGNPATH_ORG_ID }}'
          project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
          # Uses the project's DEFAULT artifact configuration ("Initial version").
          # To pin a specific one, add: artifact-configuration-slug: '<slug>'
          signing-policy-slug: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_sign) && 'test-signing' || 'release-signing' }}
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Package signed zip
        shell: bash
        run: |
          mkdir -p release
          cd signed
          7z a -mx=9 "$GITHUB_WORKSPACE/release/PadForge-v${{ steps.stage.outputs.version }}-win-x64.zip" PadForge.exe

      # Optional: confirm the signature landed before publishing.
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "signed/PadForge.exe"
          Write-Host "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Warning "Signature not Valid (expected for the test cert until the production cert is imported)." }

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PadForge ${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            "release/PadForge-v${{ steps.stage.outputs.version }}-win-x64.zip"

      # On a manual (workflow_dispatch) run, just keep the signed zip as a
      # build artifact so you can download and inspect it.
      - name: Upload signed zip (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: PadForge-signed-zip
          path: release/PadForge-v${{ steps.stage.outputs.version }}-win-x64.zip
