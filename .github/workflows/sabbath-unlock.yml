# Sabbath emergency unlock.
#
# workflow_dispatch only. Use sparingly. The sabbath lock set by
# sabbath-lock.yml expires automatically after 24 hours, so this is
# only for the rare case where the lock needs to be released early.
#
# Same authentication requirement as sabbath-lock.yml. The repository
# secret SABBATH_PAT must be a fine-grained Personal Access Token with
# `Administration: write` for this repository. See the header comment
# in sabbath-lock.yml for setup steps.

name: Sabbath unlock

on:
  workflow_dispatch:

permissions: {}

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Remove interaction limit
        env:
          PAT: ${{ secrets.SABBATH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "SABBATH_PAT secret is not set. See header comment in sabbath-lock.yml." >&2
            exit 1
          fi
          curl -fsSL -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/interaction-limits"
